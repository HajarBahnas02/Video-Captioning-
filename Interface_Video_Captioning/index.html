<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Upload Vidéo</title>
  <style>
    body {
       background: #f8f6f7;
      color: #333;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }

    #uploadForm {
      background-color: #ffffff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    h2 {
      color: #4caf50;
      margin-bottom: 2rem;
    }

    .custum-file-upload {
      height: 200px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      border: 2px dashed #888;
      background-color: #212121;
      padding: 1.5rem;
      border-radius: 12px;
      transition: 0.3s;
      position: relative;
    }

    .custum-file-upload:hover {
      border-color: #ccc;
      background-color: #2a2a2a;
    }

    .custum-file-upload svg {
      height: 80px;
      fill: #bbbbbb;
    }

    .custum-file-upload span {
      font-weight: 500;
      color: #bbbbbb;
    }

    .custum-file-upload input {
      display: none;
    }

    /* Style pour le nom fichier + symbole */
    #fileName {
      margin-top: 10px;
      color: #4caf50;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
    }
    #fileName svg {
      fill: #4caf50;
      width: 20px;
      height: 20px;
    }

    .loader {
      margin-top: 10px;
      display: none;
      color: #aaa;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
    }
    .loader svg {
      animation: spin 1s linear infinite;
      width: 20px;
      height: 20px;
      fill: #aaa;
    }

    @keyframes spin {
      from { transform: rotate(0deg);}
      to { transform: rotate(360deg);}
    }

    /* Nouveau style de bouton */
    .cssbuttons-io-button {
      background: #a370f0;
      color: white;
      font-family: inherit;
      padding: 0.35em;
      padding-left: 1.2em;
      font-size: 17px;
      font-weight: 500;
      border-radius: 0.9em;
      border: none;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      box-shadow: inset 0 0 1.6em -0.6em #714da6;
      overflow: hidden;
      position: relative;
      height: 2.8em;
      padding-right: 3.3em;
      cursor: pointer;
      margin-top: 20px;
    }

    .cssbuttons-io-button .icon {
      background: white;
      margin-left: 1em;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 2.2em;
      width: 2.2em;
      border-radius: 0.7em;
      box-shadow: 0.1em 0.1em 0.6em 0.2em #7b52b9;
      right: 0.3em;
      transition: all 0.3s;
    }

    .cssbuttons-io-button:hover .icon {
      width: calc(100% - 0.6em);
    }

    .cssbuttons-io-button .icon svg {
      width: 1.1em;
      transition: transform 0.3s;
      color: #7b52b9;
    }

    .cssbuttons-io-button:hover .icon svg {
      transform: translateX(0.1em);
    }

    .cssbuttons-io-button:active .icon {
      transform: scale(0.95);
    }
    .main-title {
        font-family: cursive;
      font-size: 2.2rem;
      color: #ffffff;
      text-align: center;
      margin-bottom: 2rem;
      background: linear-gradient(90deg, #a370f0, #7b52b9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: bold;
      
    }

  </style>
</head>
<body>
  <h2 class="main-title">🎥 Explorez le contenu de votre vidéo ⬇</h2>

  <form id="uploadForm" enctype="multipart/form-data">
    <label for="file" class="custum-file-upload">
      <svg viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M10 1C9.7 1 9.5 1.1 9.3 1.3L3.3 7.3C3.1 7.5 3 7.7 3 8V20C3 21.7 4.3 23 6 23H7C7.6 23 8 22.6 8 22C8 21.4 7.6 21 7 21H6C5.4 21 5 20.6 5 20V9H10C10.6 9 11 8.6 11 8V3H18C18.6 3 19 3.4 19 4V9C19 9.6 19.4 10 20 10C20.6 10 21 9.6 21 9V4C21 2.3 19.7 1 18 1H10ZM9 7H6.4L9 4.4V7ZM14 15.5C14 14.1 15.1 13 16.5 13C17.9 13 19 14.1 19 15.5V17H20C21.1 17 22 17.9 22 19C22 20.1 21.1 21 20 21H13C11.9 21 11 20.1 11 19C11 17.9 11.9 17 13 17H14V15.5ZM16.5 11C14.1 11 12.2 12.8 12 15.1C10.3 15.6 9 17.1 9 19C9 21.2 10.8 23 13 23H20C22.2 23 24 21.2 24 19C24 17.1 22.7 15.6 21 15.1C20.8 12.8 18.9 11 16.5 11Z"></path></svg>
      <span>Importer une vidéo</span>
      <input id="file" name="file" type="file" accept="video/mp4" required>
    </label>

    <!-- Affichage du nom du fichier -->
    <div id="fileName"></div>

    <!-- Nouveau bouton stylisé -->
    <button type="submit" class="cssbuttons-io-button">
      Envoyer
      <div class="icon">
        <svg height="24" width="24" viewBox="0 0 24 24">
          <path d="M0 0h24v24H0z" fill="none"></path>
          <path d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z" fill="currentColor"></path>
        </svg>
      </div>
    </button>

    <div class="loader" id="loader">
      <svg viewBox="0 0 50 50">
        <circle cx="25" cy="25" r="20" stroke-width="5" stroke="#aaa" fill="none" stroke-linecap="round"/>
      </svg>
      Analyse en cours…
    </div>
  </form>

  <script>
    const form = document.getElementById("uploadForm");
    const loader = document.getElementById("loader");
    const fileInput = document.getElementById("file");
    const fileNameDiv = document.getElementById("fileName");

    // Affiche le nom du fichier + symbole dès la sélection
    fileInput.addEventListener("change", () => {
      if (fileInput.files.length > 0) {
        const name = fileInput.files[0].name;
        // Symbole vidéo : 🎬 (ou un svg)
        fileNameDiv.innerHTML = `🎬 ${name}`;
      } else {
        fileNameDiv.innerHTML = "";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      // Affiche le loader uniquement ici, au moment de l'envoi
      loader.style.display = "flex";

      const formData = new FormData(form);

      try {
        const response = await fetch("https://a1ef-34-125-151-185.ngrok-free.app/analyze", {
          method: "POST",
          body: formData
        });

        if (!response.ok) throw new Error("Erreur lors de l'envoi.");

        const data = await response.json();

        localStorage.setItem("audio", data.audio_transcription);
        localStorage.setItem("last_image_description", JSON.stringify(data.last_image_description));

        window.location.href = "result.html";
      } catch (error) {
        alert("❌ " + error.message);
      } finally {
        loader.style.display = "none";
      }
    });
  </script>
</body>
</html>
